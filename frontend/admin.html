<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>访客统计</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #111111;
      --text-soft: #333333;
      --text-faint: #888888;
      --border: #e0e0e0;
      --border-soft: #eeeeee;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 32px 64px;
    }

    /* 顶部 */
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 28px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
    }
    .header .meta {
      font-size: 12px;
      color: var(--text-faint);
      font-variant-numeric: tabular-nums;
    }

    /* 统计卡 */
    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 18px 20px;
    }
    .stat-label {
      font-size: 12px;
      color: var(--text-faint);
      margin-bottom: 8px;
    }
    .stat-value {
      font-size: 26px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }
    .stat-value .unit {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-faint);
      margin-left: 4px;
    }

    /* 工具条 */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }
    .toolbar h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-soft);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-faint);
    }
    .btn {
      appearance: none;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-soft);
      padding: 6px 14px;
      font-family: inherit;
      font-size: 12px;
      border-radius: 3px;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
    }
    .btn:hover {
      background: #f5f5f5;
      border-color: #ccc;
      color: var(--text);
    }
    .btn[disabled] {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }
    .btn--primary {
      background: var(--text);
      border-color: var(--text);
      color: #fff;
    }
    .btn--primary:hover {
      background: #000;
      border-color: #000;
      color: #fff;
    }

    /* 表格 */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    table.ledger {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .ledger thead th {
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-soft);
      background: #f5f5f5;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
    }
    .ledger tbody td {
      padding: 10px 14px;
      border-top: 1px solid var(--border-soft);
      font-size: 13px;
      color: var(--text-soft);
      vertical-align: middle;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .ledger tbody tr:first-child td { border-top: none; }
    .ledger tbody tr:nth-child(even) td { background: #fafafa; }
    .ledger tbody tr:hover td { background: #f0f0f0; }

    /* 列宽 */
    .col-id { width: 64px; }
    .col-time { width: 170px; }
    .col-device { width: 96px; }
    .col-path { width: 180px; }
    .col-ip { width: 120px; }
    .col-ip-count { width: 80px; }
    .col-ua { width: auto; }

    .col-id {
      font-variant-numeric: tabular-nums;
      color: var(--text-faint);
      font-size: 12px;
    }
    .col-time {
      font-variant-numeric: tabular-nums;
      font-size: 12px;
    }
    .col-time .date { color: var(--text-soft); }
    .col-time .time { color: var(--text-faint); margin-left: 6px; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      background: #f0f0f0;
      color: var(--text-soft);
      border: 1px solid var(--border);
    }
    .badge--mobile  { background: #f0f0f0; color: #333; }
    .badge--tablet  { background: #f0f0f0; color: #555; }
    .badge--desktop { background: #f0f0f0; color: #222; }
    .badge--unknown { background: #f5f5f5; color: var(--text-faint); }

    .col-path {
      font-size: 12px;
      color: var(--text-soft);
    }
    .col-ip {
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: var(--text-faint);
    }
    .col-ip-count {
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      color: var(--text-soft);
      text-align: center;
    }
    .col-ua {
      font-size: 12px;
      color: var(--text-faint);
    }

    /* 空状态 */
    .empty {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-faint);
      font-size: 14px;
    }

    /* 加载骨架 */
    .skeleton-row td {
      color: transparent !important;
    }
    .skeleton-row td > span {
      display: inline-block;
      height: 10px;
      width: 70%;
      background: linear-gradient(90deg, #f0f0f0, #e8e8e8, #f0f0f0);
      background-size: 200% 100%;
      animation: shimmer 1.4s linear infinite;
      border-radius: 2px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* 分页 */
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      gap: 16px;
    }
    .pager-info {
      font-size: 12px;
      color: var(--text-faint);
    }
    .pager-info b {
      color: var(--text);
      font-weight: 600;
      margin: 0 2px;
      font-variant-numeric: tabular-nums;
    }
    .pager-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 页脚 */
    .footer {
      margin-top: 40px;
      padding-top: 16px;
      border-top: 1px solid var(--border-soft);
      font-size: 12px;
      color: var(--text-faint);
      text-align: center;
    }

    /* 响应式 */
    .stat-sub {
      font-size: 11px;
      color: var(--text-faint);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 960px) {
      .page { padding: 28px 18px 48px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .ledger { table-layout: auto; }
      .col-ua, .col-ua-h { display: none; }
    }
    @media (max-width: 640px) {
      .stats { grid-template-columns: 1fr; }
      .col-ip, .col-ip-h, .col-ip-count, .col-ip-count-h { display: none; }
      .toolbar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>访客统计</h1>
      <div class="meta" id="meta-now">—</div>
    </header>

    <section class="stats" aria-label="Summary">
      <div class="stat">
        <div class="stat-label">总人次</div>
        <div class="stat-value" id="stat-total">—<span class="unit">人次</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">今日（本页样本）</div>
        <div class="stat-value" id="stat-today">—<span class="unit">次</span></div>
      </div>
      <div class="stat">
        <div class="stat-label">主流终端</div>
        <div class="stat-value" id="stat-device" style="font-size:20px;">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">最近一次</div>
        <div class="stat-value" id="stat-last" style="font-size:20px;">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">独立访客</div>
        <div class="stat-value" id="stat-unique-ips">—<span class="unit">IP</span></div>
        <div class="stat-sub" id="stat-top-ip"></div>
      </div>
    </section>

    <div class="toolbar">
      <h2>最近访客</h2>
      <div class="controls">
        <span id="status-text">就绪</span>
        <button class="btn btn--primary" id="btn-refresh">刷新</button>
      </div>
    </div>

    <div class="table-wrap">
      <table class="ledger">
        <colgroup>
          <col class="col-id" />
          <col class="col-time" />
          <col class="col-device" />
          <col class="col-path" />
          <col class="col-ip" />
          <col class="col-ip-count" />
          <col class="col-ua" />
        </colgroup>
        <thead>
          <tr>
            <th>#</th>
            <th>访问时间</th>
            <th>设备</th>
            <th>页面路径</th>
            <th class="col-ip-h">IP</th>
            <th class="col-ip-count-h">IP次数</th>
            <th class="col-ua-h">浏览器信息</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr class="skeleton-row"><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td><td class="col-ip"><span></span></td><td class="col-ip-count"><span></span></td><td class="col-ua"><span></span></td></tr>
          <tr class="skeleton-row"><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td><td class="col-ip"><span></span></td><td class="col-ip-count"><span></span></td><td class="col-ua"><span></span></td></tr>
          <tr class="skeleton-row"><td><span></span></td><td><span></span></td><td><span></span></td><td><span></span></td><td class="col-ip"><span></span></td><td class="col-ip-count"><span></span></td><td class="col-ua"><span></span></td></tr>
        </tbody>
      </table>
    </div>

    <div class="pager">
      <div class="pager-info" id="pager-info">—</div>
      <div class="pager-controls">
        <button class="btn" id="btn-prev">← Prev</button>
        <button class="btn" id="btn-next">Next →</button>
      </div>
    </div>

    <footer class="footer">
      © Shanghai Disney Digital Twin · Internal
    </footer>
  </main>

  <script>
    /**
     * 与 src/api/base.js 同款的 API 前缀推断：
     * 通过 Live Server / 非 3000 端口打开时，自动指向本机 :3000 上的 Express。
     */
    function inferApiBase() {
      if (typeof window === "undefined" || !window.location) return "";
      const { hostname, port, protocol } = window.location;
      if (protocol === "file:") return "http://localhost:3000";
      const isLocal =
        hostname === "localhost" || hostname === "127.0.0.1" || hostname === "[::1]";
      if (!isLocal) return "";
      const effectivePort = port || (protocol === "https:" ? "443" : "80");
      if (effectivePort === "3000") return "";
      return `http://${hostname}:3000`;
    }
    const API_BASE = inferApiBase();

    const state = { page: 1, limit: 50, total: 0, pages: 1, data: [], uniqueIps: 0, ipCountMap: {} };
    const $ = (id) => document.getElementById(id);

    function fmtTime(iso) {
      // SQLite 默认 CURRENT_TIMESTAMP 是 UTC 字符串 "YYYY-MM-DD HH:MM:SS"
      let d;
      if (!iso) return { date: '—', time: '' };
      if (typeof iso === 'string' && iso.includes(' ') && !iso.endsWith('Z')) {
        d = new Date(iso.replace(' ', 'T') + 'Z');
      } else {
        d = new Date(iso);
      }
      if (isNaN(d.getTime())) return { date: String(iso), time: '' };
      const pad = (n) => String(n).padStart(2, '0');
      return {
        date: `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`,
        time: `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`
      };
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function deviceBadge(type) {
      const map = {
        mobile: { label: 'Mobile', cls: 'badge--mobile' },
        tablet: { label: 'Tablet', cls: 'badge--tablet' },
        desktop: { label: 'Desktop', cls: 'badge--desktop' },
        unknown: { label: 'Unknown', cls: 'badge--unknown' }
      };
      const m = map[type] || map.unknown;
      return `<span class="badge ${m.cls}">${m.label}</span>`;
    }

    function shortUa(ua) {
      if (!ua) return '—';
      const inside = (ua.match(/\(([^)]+)\)/) || [])[1] || '';
      const platform = inside.split(';')[0]?.trim() || '';
      const browser =
        (ua.match(/(Edg|Chrome|Firefox|Safari|OPR|Opera)\/[\d.]+/g) || [])
          .pop() || '';
      const parts = [platform, browser].filter(Boolean);
      return parts.length ? parts.join(' · ') : ua.slice(0, 72) + (ua.length > 72 ? '…' : '');
    }

    function render() {
      const tbody = $('tbody');
      if (!state.data.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty">尚无访客记录</td></tr>`;
      } else {
        tbody.innerHTML = state.data.map((r) => {
          const t = fmtTime(r.visited_at);
          const ipCount = r.ip && state.ipCountMap[r.ip] ? state.ipCountMap[r.ip] : '—';
          return `<tr>
            <td class="col-id">${String(r.id).padStart(4, '0')}</td>
            <td class="col-time"><span class="date">${t.date}</span><span class="time">${t.time}</span></td>
            <td>${deviceBadge(r.device_type)}</td>
            <td class="col-path" title="${escapeHtml(r.page_path)}">${escapeHtml(r.page_path || '—')}</td>
            <td class="col-ip">${escapeHtml(r.ip || '—')}</td>
            <td class="col-ip-count">${ipCount}</td>
            <td class="col-ua" title="${escapeHtml(r.user_agent)}">${escapeHtml(shortUa(r.user_agent))}</td>
          </tr>`;
        }).join('');
      }

      $('stat-total').innerHTML = `${state.total.toLocaleString()}<span class="unit">人次</span>`;
      $('stat-unique-ips').innerHTML = `${state.uniqueIps.toLocaleString()}<span class="unit">IP</span>`;

      // 显示访问最多的IP
      const topIpEntry = Object.entries(state.ipCountMap).sort((a, b) => b[1] - a[1])[0];
      if (topIpEntry) {
        $('stat-top-ip').textContent = `Top: ${topIpEntry[0]} (${topIpEntry[1]}次)`;
      } else {
        $('stat-top-ip').textContent = '';
      }

      const today = new Date();
      const todayKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      let todayCount = 0;
      const devCount = { mobile: 0, tablet: 0, desktop: 0, unknown: 0 };
      let lastSeen = null;
      for (const r of state.data) {
        const d = r.visited_at && r.visited_at.includes(' ')
          ? new Date(r.visited_at.replace(' ', 'T') + 'Z')
          : new Date(r.visited_at);
        if (!isNaN(d.getTime())) {
          const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
          if (key === todayKey) todayCount++;
          if (!lastSeen || d > lastSeen) lastSeen = d;
        }
        devCount[r.device_type] = (devCount[r.device_type] || 0) + 1;
      }
      $('stat-today').innerHTML = `${todayCount}<span class="unit">次</span>`;

      const topDev = Object.entries(devCount)
        .filter(([, v]) => v > 0)
        .sort((a, b) => b[1] - a[1])[0];
      $('stat-device').textContent = topDev ? topDev[0].replace(/^./, c => c.toUpperCase()) : '—';

      if (lastSeen) {
        const diff = (Date.now() - lastSeen.getTime()) / 1000;
        let ago;
        if (diff < 60) ago = `${Math.floor(diff)} 秒前`;
        else if (diff < 3600) ago = `${Math.floor(diff / 60)} 分钟前`;
        else if (diff < 86400) ago = `${Math.floor(diff / 3600)} 小时前`;
        else ago = `${Math.floor(diff / 86400)} 天前`;
        $('stat-last').textContent = ago;
      } else {
        $('stat-last').textContent = '—';
      }

      const start = state.total === 0 ? 0 : (state.page - 1) * state.limit + 1;
      const end = Math.min(state.total, state.page * state.limit);
      $('pager-info').innerHTML = `显示第 <b>${start}</b> – <b>${end}</b> 条，共 <b>${state.total}</b> 条 · 第 <b>${state.page}</b> / <b>${state.pages}</b> 页`;
      $('btn-prev').disabled = state.page <= 1;
      $('btn-next').disabled = state.page >= state.pages;
    }

    async function load() {
      $('status-text').textContent = '加载中…';
      try {
        const [visitorsRes, statsRes] = await Promise.all([
          fetch(`${API_BASE}/api/visitors?page=${state.page}&limit=${state.limit}`),
          fetch(`${API_BASE}/api/visitors/stats?limit=100`)
        ]);
        const json = await visitorsRes.json();
        if (!json.ok) throw new Error(json.error || 'Unknown error');
        state.total = json.total || 0;
        state.pages = json.pages || 1;
        state.data = json.data || [];
        state.uniqueIps = json.uniqueIps || 0;

        // 构建 IP → 访问次数 映射
        try {
          const statsJson = await statsRes.json();
          if (statsJson.ok && statsJson.topIps) {
            state.ipCountMap = {};
            for (const item of statsJson.topIps) {
              state.ipCountMap[item.ip] = item.visit_count;
            }
          }
        } catch (_) { /* stats 加载失败不影响主数据 */ }

        render();
        $('status-text').textContent = '已同步 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
      } catch (e) {
        $('tbody').innerHTML = `<tr><td colspan="7" class="empty">加载失败：${escapeHtml(e.message)}</td></tr>`;
        $('status-text').textContent = '加载失败';
      }
    }

    function tickClock() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      $('meta-now').textContent =
        `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} · ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }
    setInterval(tickClock, 1000);
    tickClock();

    $('btn-refresh').addEventListener('click', load);
    $('btn-prev').addEventListener('click', () => {
      if (state.page > 1) { state.page--; load(); }
    });
    $('btn-next').addEventListener('click', () => {
      if (state.page < state.pages) { state.page++; load(); }
    });

    load();
  </script>
</body>
</html>
