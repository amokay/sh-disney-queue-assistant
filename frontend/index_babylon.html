<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>上迪游玩助手</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./src/styles-planner.css" />
    <!-- Babylon.js 核心 + Loaders（GLB 支持） - 指定7.35.0稳定版本 -->
    <script src="https://cdn.jsdelivr.net/npm/babylonjs@7.35.0/babylon.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@7.35.0/babylonjs.loaders.min.js"></script>
    <!-- 可选：GUI（如需 AdvancedDynamicTexture 做 3D UI） -->
    <!-- <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script> -->
    <!-- 可选：Inspector（仅开发阶段，生产环境移除） -->
    <!-- <script src="https://cdn.babylonjs.com/inspector/babylon.inspector.bundle.js"></script> -->
    <style>
      html, body {
        background: radial-gradient(75.87% 50.73% at 50.01% 45.63%, #1E40AF 0%, #1E3A8A 50%, #172554 100%);
      }
      .loading-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-bottom: calc(35vh - 5px);
        background: radial-gradient(75.87% 50.73% at 50.01% 45.63%, #1E40AF 0%, #1E3A8A 50%, #172554 100%);
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .loading-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .progress-ring__fill {
        transition: stroke-dashoffset 0.3s ease;
      }
    </style>
  </head>
  <body>
    <!-- 圆环加载动效 -->
    <div id="loading-overlay" class="loading-overlay">
      <svg class="progress-ring" width="40" height="40" viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="36"
          fill="none" stroke="#1E3A8A" stroke-width="8"/>
        <circle id="progress-ring-fill" class="progress-ring__fill" cx="40" cy="40" r="36"
          fill="none" stroke="#3B82F6" stroke-width="8"
          stroke-dasharray="226.2" stroke-dashoffset="226.2"
          stroke-linecap="round" transform="rotate(-90 40 40)"/>
      </svg>
    </div>
    <div id="ui-root"></div>
    <canvas id="c" tabindex="0"></canvas>
    <script type="module" src="./src/main_new.js"></script>
  </body>
</html>
