<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>上迪游玩助手</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="./src/styles-planner.css" />
    <!-- Babylon.js 核心 + Loaders（GLB 支持） -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <!-- 可选：GUI（如需 AdvancedDynamicTexture 做 3D UI） -->
    <!-- <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script> -->
    <!-- 可选：Inspector（仅开发阶段，生产环境移除） -->
    <!-- <script src="https://cdn.babylonjs.com/inspector/babylon.inspector.bundle.js"></script> -->
    <style>
      html, body {
        background: linear-gradient(to bottom, #7272DD, #494987);
      }
      .loading-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-bottom: 35vh;
        background: linear-gradient(to bottom, #7272DD, #494987);
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .loading-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .progress-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .progress-text {
        position: absolute;
        color: #fff;
        font-size: 20px;
        font-weight: 500;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .progress-ring__fill {
        transition: stroke-dashoffset 0.3s ease;
      }
    </style>
  </head>
  <body>
    <!-- 圆环加载动效（百分比进度） -->
    <div id="loading-overlay" class="loading-overlay">
      <div class="progress-container">
        <svg class="progress-ring" width="80" height="80" viewBox="0 0 80 80">
          <circle class="progress-ring__bg" cx="40" cy="40" r="36"
            fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
          <circle class="progress-ring__fill" cx="40" cy="40" r="36"
            fill="none" stroke="#fff" stroke-width="4"
            stroke-dasharray="226.2" stroke-dashoffset="226.2"
            stroke-linecap="round" transform="rotate(-90 40 40)"/>
        </svg>
        <div class="progress-text">0%</div>
      </div>
    </div>
    <div id="ui-root"></div>
    <canvas id="c" tabindex="0"></canvas>
    <script type="module" src="./src/main_new.js"></script>
  </body>
</html>
