<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>上迪游玩助手 - 行前规划</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="./src/styles-planner.css" />
    <!-- Babylon.js 核心 + Loaders（GLB 支持） -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
      html, body {
        background: linear-gradient(to bottom, #7272DD, #494987);
      }
      .loading-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-bottom: calc(35vh - 5px);
        background: linear-gradient(to bottom, #7272DD, #494987);
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      .loading-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .progress-ring__fill {
        transition: stroke-dashoffset 0.3s ease;
      }
    </style>
  </head>
  <body>
    <!-- 圆环加载动效 -->
    <div id="loading-overlay" class="loading-overlay">
      <svg class="progress-ring" width="40" height="40" viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="36"
          fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8"/>
        <circle id="progress-ring-fill" class="progress-ring__fill" cx="40" cy="40" r="36"
          fill="none" stroke="#fff" stroke-width="8"
          stroke-dasharray="226.2" stroke-dashoffset="226.2"
          stroke-linecap="round" transform="rotate(-90 40 40)"/>
      </svg>
    </div>
    <div id="ui-root"></div>
    <canvas id="c" tabindex="0"></canvas>
    <script type="module" src="./src/main_pretrip.js"></script>
  </body>
</html>
