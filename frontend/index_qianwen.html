<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>飞猪千问</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F7F8FA;
      font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #0F131A;
    }

    .page {
      position: relative;
      width: 750px;
      height: 1624px;
      background: #F7F8FA;
      overflow: hidden;
    }

    /* bg-置于页面底部不动 */
    .bg-bottom {
      position: absolute;
      width: 100%;
      height: 560px;
      left: 0;
      bottom: 79px;
      background: #F7F8FA;
      transform: rotate(-180deg);
    }

    /* 背景渐变色 */
    .bg-gradient {
      position: absolute;
      width: 100%;
      height: 420px;
      left: 0;
      top: 140px;
    }

    /* 顶部组件 */
    .top-bar {
      position: absolute;
      width: 100%;
      height: 176px;
      left: 0;
      top: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 10;
    }

    /* status-bar 样式与 .planner-titlebar__statusbar 完全一致（750 设计稿下数值×2） */
    .status-bar {
      position: relative;
      width: 100%;
      height: 88px;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 32px;
      box-sizing: border-box;
      pointer-events: none;
      /* 设计稿 750px@88px：时间 32.4427px / 行高 42px → 375px 视口下约 16px / 21px */
    }
    .status-bar__time {
      font-family: 'SF Pro Text', 'SF Pro', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      font-weight: 600;
      font-size: 28px;
      line-height: 42px;
      letter-spacing: -0.4px;
      color: #000000;
      font-variant-numeric: tabular-nums;
      min-width: 108px;
      text-align: left;
      /* 与 iOS 状态栏一致，向左收紧避开刘海区 */
      padding-left: 12px;
    }
    .status-bar__icons {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-right: 4px;
    }
    .status-bar__icon {
      display: block;
      flex-shrink: 0;
    }
    .status-bar__icon--signal { height: 22px; }
    .status-bar__icon--wifi { height: 22px; }
    .status-bar__icon--battery { height: 24px; }

    /* 导航栏 */
    .nav-bar {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      width: 100%;
      height: 88px;
      background: #F7F8FA;
    }

    .nav-bar__left {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 18px;
      width: 114px;
      height: 48px;
    }

    .nav-bar__center {
      display: flex;
      flex-direction: row;
      align-items: center;
      width: 144px;
      height: 50px;
    }

    .nav-bar__title {
      width: 144px;
      height: 50px;
      font-weight: 500;
      font-size: 34px;
      line-height: 140%;
      text-align: center;
      color: #0F131A;
    }

    .nav-bar__right {
      display: flex;
      flex-direction: row;
      justify-content: flex-end;
      align-items: center;
      gap: 18px;
      width: 114px;
      height: 48px;
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
    }

    /* 底部输入区 */
    .bottom-input {
      position: absolute;
      width: 100%;
      left: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 18px 18px 0px;
      gap: 18px;
      isolation: isolate;
      z-index: 10;
    }

    .bottom-input__bg {
      position: absolute;
      width: 750px;
      left: 0px;
      top: 0%;
      bottom: 0%;
      background: #F7F8FA;
      flex: none;
      order: 0;
      flex-grow: 0;
      z-index: 0;
    }

    /* 功能入口 */
    .tool-entries {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      padding: 0;
      gap: 12px;
      width: 714px;
      height: 60px;
      flex: none;
      order: 1;
      align-self: stretch;
      flex-grow: 0;
      z-index: 1;
    }

    .tool-entry {
      box-sizing: border-box;
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 12px 18px;
      gap: 6px;
      width: 132px;
      height: 60px;
      border: 1px solid rgba(15, 19, 26, 0.3);
      border-radius: 18px;
      flex: none;
      order: 0;
      flex-grow: 0;
      cursor: pointer;
      background: transparent;
    }

    .tool-entry__label {
      font-weight: 500;
      font-size: 24px;
      line-height: 140%;
      color: #0F131A;
      white-space: nowrap;
    }

    /* 输入框 */
    .input-box {
      box-sizing: border-box;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      gap: 18px;
      width: 714px;
      height: 100px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.72) 0%, #FFFFFF 100%);
      border: 2px solid #FFFFFF;
      border-radius: 24px;
      flex: none;
      order: 2;
      align-self: stretch;
      flex-grow: 0;
      z-index: 2;
      cursor: text;
    }

    .input-box__left {
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 0;
      gap: 18px;
      width: 399px;
      height: 48px;
      flex: none;
      order: 0;
      flex-grow: 0;
    }

    .input-box__voice-icon {
      width: 48px;
      height: 48px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-box__placeholder {
      width: 333px;
      height: 48px;
      font-family: 'PingFang SC';
      font-style: normal;
      font-weight: 400;
      font-size: 34px;
      line-height: 140%;
      text-align: center;
      color: #919499;
      flex: none;
      order: 1;
      flex-grow: 0;
    }

    .input-box__right {
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 0;
      gap: 24px;
      width: 48px;
      height: 48px;
      flex: none;
      order: 2;
      flex-grow: 0;
    }

    .input-box__send {
      width: 48px;
      height: 48px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-box__send-circle {
      width: 46px;
      height: 46px;
      background: #0F131A;
      border-radius: 23px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .input-box__send-square {
      width: 12px;
      height: 12px;
      background: #FFFFFF;
      border-radius: 2px;
    }

    /* ===== 对话内容区 ===== */
    .chat-content {
      position: absolute;
      left: 0;
      top: 176px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }

    /* —— 用户消息（靠右对齐） —— */
    .chat-user-msg {
      display: flex;
      flex-direction: row;
      justify-content: flex-end;
      align-items: center;
      padding: 24px 0;
      width: 690px;
      height: 156px;
    }
    .chat-user-bubble {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      padding: 30px;
      gap: 10px;
      width: fit-content;
      min-width: 230px;
      max-width: 600px;
      height: 108px;
      background: linear-gradient(180deg, #E4E4FF 0%, #EDEDFF 100%);
      border-radius: 36px;
      box-sizing: border-box;
    }
    .chat-user-bubble__text {
      font-family: 'PingFang SC';
      font-weight: 400;
      font-size: 34px;
      line-height: 140%;
      color: #0F131A;
      flex-grow: 1;
    }

    /* —— AI 纯文本回复 —— */
    .chat-ai-text {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      width: 690px;
    }
    .chat-ai-text__content {
      font-family: 'PingFang SC';
      font-weight: 400;
      font-size: 34px;
      line-height: 170%;
      color: #222222;
      flex-grow: 1;
    }

    /* —— AI 卡片模块 —— */
    .chat-ai-card-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 0 0;
      width: 690px;
      border-radius: 36px;
    }
    .chat-ai-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 0 24px 24px;
      width: 690px;
      background: #FFFFFF;
      border-radius: 36px;
      box-sizing: border-box;
    }

    /* 订单金额行 */
    .card-amount-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 24px 0 0;
      gap: 12px;
      width: 642px;
      height: 64px;
    }
    .card-amount-label {
      font-family: 'PingFang SC';
      font-weight: 400;
      font-size: 24px;
      line-height: 140%;
      color: #919499;
    }
    .card-amount-price {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      gap: 4px;
    }
    .card-amount-currency {
      font-family: 'PingFang SC';
      font-weight: 400;
      font-size: 20px;
      line-height: 36px;
      color: #FF5533;
    }
    .card-amount-value {
      font-family: 'PingFang SC';
      font-weight: 500;
      font-size: 28px;
      line-height: 40px;
      color: #FF5533;
    }

    /* 标题行 */
    .card-title-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 18px 0 0;
      gap: 12px;
      width: 642px;
      height: 57px;
    }
    .card-title-tag {
      background: #EBEBFF;
      border-radius: 8px;
      padding: 10px 8px;
      font-family: 'PingFang SC';
      font-weight: 400;
      font-size: 22px;
      line-height: 1;
      color: #5C5CFF;
    }
    .card-title-text {
      font-family: 'PingFang SC';
      font-weight: 500;
      font-size: 28px;
      line-height: 140%;
      color: #0F131A;
      flex-grow: 1;
    }

    /* 标签栏 */
    .card-tag-row {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      padding: 18px 0 0;
      gap: 12px;
      width: 642px;
      height: 52px;
    }
    .card-tag-item {
      font-family: 'PingFang SC';
      font-weight: 400;
      font-size: 24px;
      line-height: 140%;
      color: #0F131A;
    }
    .card-tag-item--cabin { width: 84px; }
    .card-tag-item--dur { width: 72px; }
    .card-tag-divider {
      width: 1px;
      height: 24px;
      background: #D2D4D9;
      transform: rotate(90deg);
    }

    /* 出行人区域 */
    .card-passenger-section {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 42px 0 24px;
      gap: 18px;
      width: 642px;
      height: 152px;
      font-size: 24px;
    }
    .card-passenger-row {
      display: flex;
      flex-direction: row;
      gap: 18px;
      width: 642px;
    }
    .card-passenger-cell {
      font-family: 'PingFang SC';
      font-weight: 400;
      font-size: 24px;
      line-height: 140%;
      color: #919499;
    }
    .card-passenger-cell--label { width: 91px; }
    .card-passenger-cell--name { width: 72px; }
    .card-passenger-cell--id { width: 221px; }

    /* 行动点按钮区域 */
    .card-actions {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      padding: 18px 0px 0px;
      gap: 16px;
      width: 642px;
      height: 98px;
      order: 10;
    }
    .card-action-btn {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      padding: 20px 32px;
      gap: 8px;
      width: 642px;
      height: 80px;
      background: #F2F3F5;
      border-radius: 24px;
      flex-grow: 1;
      border: none;
      cursor: pointer;
    }
    .card-action-btn__icon {
      display: none;
      width: 32px;
      height: 32px;
    }
    .card-action-btn__text {
      font-family: 'PingFang SC';
      font-weight: 500;
      font-size: 26px;
      line-height: 140%;
      color: #0F131A;
    }
    .card-action-btn--secondary {
      width: 313px;
      background: #EBEBFF;
      mix-blend-mode: normal;
    }
    .card-action-btn--large {
      width: 194px;
      background: #F8F8F8;
      border-radius: 20px;
    }

    /* —— AI 回答底部工具栏 —— */
    .chat-ai-footer {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 24px 0 0;
      gap: 18px;
      width: 690px;
    }
    .chat-ai-footer__tip {
      font-family: 'PingFang SC';
      font-weight: 400;
      font-size: 24px;
      line-height: 140%;
      color: #919499;
    }
    .chat-ai-footer__actions {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 12px;
      width: 690px;
    }
    .chat-ai-footer__btns {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
    }
    .chat-tool-btn {
      width: 72px;
      height: 72px;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #FFFFFF;
      border: 1px solid rgba(15, 19, 26, 0.12);
      border-radius: 24px;
      padding: 0;
      cursor: pointer;
    }
    .chat-ai-footer__status {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      flex-grow: 1;
      height: 72px;
    }
    .chat-status-pill {
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 18px 24px 18px 18px;
      gap: 12px;
      background: #FFFFFF;
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 24px;
    }
    .chat-status-pill__emoji {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      line-height: 1;
    }
    .chat-status-pill__text {
      font-family: 'PingFang SC';
      font-weight: 400;
      font-size: 26px;
      line-height: 140%;
      color: #0F131A;
    }

    /* —— 推荐词条 —— */
    .chat-suggest-strips {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      padding: 36px 0px 24px 0px;
      width: 690px;
    }
    .suggest-strip {
      box-sizing: border-box;
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 30px 36px 30px 30px;
      gap: 12px;
      height: 102px;
      background: #FFFFFF;
      backdrop-filter: blur(2px);
      border-radius: 36px;
      flex: none;
      cursor: pointer;
    }
    .suggest-strip__icon {
      width: 15px;
      height: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .suggest-strip__text {
      font-family: 'PingFang SC';
      font-weight: 400;
      font-size: 30px;
      line-height: 140%;
      color: #0F131A;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- 底部背景 -->
    <div class="bg-bottom"></div>
    <!-- 背景渐变色 -->
    <div class="bg-gradient"></div>

    <!-- 顶部组件 -->
    <div class="top-bar">
      <!-- 状态栏 -->
      <div class="status-bar">
        <span class="status-bar__time" id="qianwenStatusBarTime">9:41</span>
        <div class="status-bar__icons">
          <svg class="status-bar__icon status-bar__icon--signal" width="34" height="22" viewBox="0 0 17 11" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="0" y="7" width="3" height="4" rx="0.8" fill="#000000"/>
            <rect x="4.5" y="5" width="3" height="6" rx="0.8" fill="#000000"/>
            <rect x="9" y="2.5" width="3" height="8.5" rx="0.8" fill="#000000"/>
            <rect x="13.5" y="0" width="3" height="11" rx="0.8" fill="#000000"/>
          </svg>
          <svg class="status-bar__icon status-bar__icon--wifi" width="30" height="22" viewBox="0 0 15 11" fill="#000000" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M7.5 0C4.66 0 2.05 1 0 2.66l1.4 1.4C3.07 2.7 5.23 2 7.5 2s4.43 0.7 6.1 2.06L15 2.66C12.95 1 10.34 0 7.5 0z"/>
            <path d="M7.5 4C5.62 4 3.85 4.66 2.45 5.85l1.4 1.4C4.85 6.46 6.13 6 7.5 6s2.65 0.46 3.65 1.25l1.4-1.4C11.15 4.66 9.38 4 7.5 4z"/>
            <circle cx="7.5" cy="9.4" r="1.5"/>
          </svg>
          <svg class="status-bar__icon status-bar__icon--battery" width="54" height="24" viewBox="0 0 27 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="0.5" y="0.5" width="22" height="11" rx="2.6" stroke="#000000" stroke-opacity="0.55"/>
            <rect x="2" y="2" width="19" height="8" rx="1.4" fill="#000000"/>
            <rect x="23.5" y="4" width="1.5" height="4" rx="0.6" fill="#000000" fill-opacity="0.55"/>
          </svg>
        </div>
      </div>

      <!-- 导航栏 -->
      <div class="nav-bar">
        <div class="nav-bar__left">
          <!-- 查看历史 icon -->
          <button class="icon-btn" aria-label="查看历史">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M38.5 10.5C39.3284 10.5 40 11.1716 40 12C40 12.8284 39.3284 13.5 38.5 13.5H9.5C8.67157 13.5 8 12.8284 8 12C8 11.1716 8.67157 10.5 9.5 10.5H38.5Z" fill="#0F131A"/>
              <path d="M28.5 22.5C29.3284 22.5 30 23.1716 30 24C30 24.8284 29.3284 25.5 28.5 25.5H9.5C8.67157 25.5 8 24.8284 8 24C8 23.1716 8.67157 22.5 9.5 22.5H28.5Z" fill="#0F131A"/>
              <path d="M33.5 34.5C34.3284 34.5 35 35.1716 35 36C35 36.8284 34.3284 37.5 33.5 37.5H9.5C8.67157 37.5 8 36.8284 8 36C8 35.1716 8.67157 34.5 9.5 34.5H33.5Z" fill="#0F131A"/>
            </svg>
          </button>
        </div>
        <div class="nav-bar__center">
          <span class="nav-bar__title">飞猪千问</span>
        </div>
        <div class="nav-bar__right">
          <button class="icon-btn" aria-label="新建会话">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M24 7.5C24.8284 7.5 25.5 8.17157 25.5 9C25.5 9.82843 24.8284 10.5 24 10.5H12C10.067 10.5 8.5 12.067 8.5 14V38.1797L11.8076 34.6182C12.4698 33.9052 13.399 33.5 14.3721 33.5H36C37.933 33.5 39.5 31.933 39.5 30V23.5C39.5 22.6716 40.1716 22 41 22C41.8284 22 42.5 22.6716 42.5 23.5V30C42.5 33.5899 39.5899 36.5 36 36.5H14.3721C14.2331 36.5 14.1004 36.5583 14.0059 36.6602L9.83203 41.1543C8.28593 42.8193 5.5 41.7253 5.5 39.4531V14C5.5 10.4101 8.41015 7.5 12 7.5H24Z" fill="black"/>
              <path d="M36.4541 3.99023C37.2825 3.99023 37.9541 4.66181 37.9541 5.49023V10.998H43.5C44.3284 10.998 45 11.6696 45 12.498C45 13.3265 44.3284 13.998 43.5 13.998H37.9541V19.4902C37.9541 20.3187 37.2825 20.9902 36.4541 20.9902C35.6257 20.9902 34.9541 20.3187 34.9541 19.4902V13.998H29.5C28.6716 13.998 28 13.3265 28 12.498C28 11.6696 28.6716 10.998 29.5 10.998H34.9541V5.49023C34.9541 4.66181 35.6257 3.99023 36.4541 3.99023Z" fill="black"/>
            </svg>
          </button>
          <!-- 新建对话 icon -->
          <button class="icon-btn" aria-label="新建对话">

  <script>
    // 通过 zoom 缩放 body，使 750px 设计稿适配任意宽度的 iframe / viewport
    const DESIGN_WIDTH = 750;
    function applyDesignScale() {
      const vw = document.documentElement.clientWidth || window.innerWidth;
      if (!vw) return;
      const scale = vw / DESIGN_WIDTH;
      document.body.style.zoom = String(scale);
    }
    applyDesignScale();
    window.addEventListener('resize', applyDesignScale);

    // ===== 状态栏时间：HH:MM，每分钟更新（与 planner-titlebar 一致） =====
    const qianwenStatusTimeEl = document.getElementById('qianwenStatusBarTime');
    const renderQianwenStatusTime = () => {
      if (!qianwenStatusTimeEl) return;
      const d = new Date();
      const hh = d.getHours();
      const mm = String(d.getMinutes()).padStart(2, '0');
      qianwenStatusTimeEl.textContent = `${hh}:${mm}`;
    };
    renderQianwenStatusTime();
    const msToNextMin = 60000 - (Date.now() % 60000);
    setTimeout(() => {
      renderQianwenStatusTime();
      setInterval(renderQianwenStatusTime, 60000);
    }, msToNextMin);

    // ===== .suggest-strip 点击跳转到行中 tab（仅未禁用的）=====
    document.querySelectorAll('.suggest-strip:not(.suggest-strip--disabled)').forEach(strip => {
      strip.addEventListener('click', () => {
        try {
          const tab = window.parent.document.querySelector('.mode-tab[data-mode="inpark"]');
          if (tab) { tab.click(); return; }
        } catch (e) { /* 跨域或非 iframe 环境 */ }
        window.location.href = 'index.html';
      });
    });

    // ===== .card-action-btn（查看订单详情）点击跳转到订详 tab =====
    document.querySelectorAll('.card-action-btn').forEach(btn => {
      if (btn.style.display === 'none') return;
      btn.addEventListener('click', () => {
        try {
          const modeTab = window.parent.document.querySelector('.mode-tab[data-mode="entry"]');
          if (modeTab) {
            modeTab.click();
            // 确保订详 tab 被选中
            const entryTab = window.parent.document.querySelector('#entry-tabs .device-tab[data-page="entry"]');
            if (entryTab) entryTab.click();
            return;
          }
        } catch (e) { /* 跨域或非 iframe 环境 */ }
        window.location.href = 'index_detail_entry.html';
      });
    });
  </script>
