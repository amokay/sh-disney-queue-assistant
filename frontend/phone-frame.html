<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shanghai Disney Twin - Phone Preview</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #EEEEFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Device Tab 切换栏 */
    .device-tabs {
      position: relative;
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
      padding: 4px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .device-tabs-slider {
      position: absolute;
      top: 4px;
      left: 4px;
      height: calc(100% - 8px);
      border-radius: 16px;
      background: #1c1c1e;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 0;
    }

    .device-tab {
      position: relative;
      z-index: 1;
      padding: 8px 24px;
      border: none;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.25s ease;
      background: transparent;
      color: #333;
      outline: none;
    }

    .device-tab:hover {
      color: #555;
    }

    .device-tab.active {
      color: #fff;
    }

    .phone-container {
      position: relative;
      width: 375px;
      height: 812px;
      transition: all 0.4s ease;
    }

    /* iPad 模式 */
    .phone-container--ipad {
      width: 1024px;
      height: 812px;
    }

    .phone-container--ipad .phone-frame {
      border-width: 16px;
      border-radius: 30px;
    }

    .phone-container--ipad .phone-screen {
      border-radius: 16px;
    }

    .phone-container--ipad .phone-screen iframe {
      border-radius: 16px;
    }

    .phone-container--ipad .dynamic-island {
      display: none;
    }

    .phone-container--ipad .home-indicator {
      width: 180px;
    }

    /* iPad 前置摄像头（左侧居中） */
    .ipad-camera {
      display: none;
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2a2a2e;
      z-index: 10;
    }

    .phone-container--ipad .ipad-camera {
      display: block;
    }

    /* iPad 模式隐藏物理按键 */
    .phone-container--ipad::after,
    .phone-container--ipad::before,
    .phone-container--ipad .volume-up,
    .phone-container--ipad .volume-down {
      display: none;
    }

    /* 手机外框 */
    .phone-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border: 12px solid #1c1c1e;
      border-radius: 50px;
      box-shadow:
        0 30px 60px rgba(0, 0, 0, 0.5),
        0 0 0 2px #333,
        inset 0 0 4px rgba(255, 255, 255, 0.05);
      background: #000;
      overflow: hidden;
    }

    /* 屏幕区域 */
    .phone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 40px;
      overflow: hidden;
      background: #000;
    }

    /* 灵动岛 */
    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 30px;
      border-radius: 20px;
      background: #000;
      z-index: 10;
    }

    /* Home Indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.3);
      z-index: 10;
    }

    /* iframe 填满屏幕 */
    .phone-screen iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 40px;
    }

    /* 右侧电源键 */
    .phone-container::after {
      content: '';
      position: absolute;
      right: -4px;
      top: 180px;
      width: 4px;
      height: 80px;
      background: linear-gradient(to bottom, #2a2a2a, #1c1c1e, #2a2a2a);
      border-radius: 0 3px 3px 0;
    }

    /* 左侧音量键 - 静音开关 */
    .phone-container::before {
      content: '';
      position: absolute;
      left: -4px;
      top: 140px;
      width: 4px;
      height: 30px;
      background: linear-gradient(to bottom, #2a2a2a, #1c1c1e, #2a2a2a);
      border-radius: 3px 0 0 3px;
    }

    /* 左侧音量键 - 音量加 */
    .volume-up {
      position: absolute;
      left: -4px;
      top: 190px;
      width: 4px;
      height: 55px;
      background: linear-gradient(to bottom, #2a2a2a, #1c1c1e, #2a2a2a);
      border-radius: 3px 0 0 3px;
    }

    /* 左侧音量键 - 音量减 */
    .volume-down {
      position: absolute;
      left: -4px;
      top: 255px;
      width: 4px;
      height: 55px;
      background: linear-gradient(to bottom, #2a2a2a, #1c1c1e, #2a2a2a);
      border-radius: 3px 0 0 3px;
    }

    /* 右下角模式切换 Tab（下划线风格） */
    .mode-tabs {
      position: absolute;
      bottom: 60px;
      right: 40px;
      display: flex;
      gap: 0;
    }

    .mode-tabs-slider {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2px;
      border-radius: 1px;
      background: #1c1c1e;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mode-tab {
      position: relative;
      padding: 6px 16px;
      border: none;
      border-radius: 0;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      transition: color 0.25s ease, font-weight 0.25s ease;
      background: transparent;
      color: #999;
      outline: none;
    }

    .mode-tab:hover {
      color: #555;
    }

    .mode-tab.active {
      color: #1c1c1e;
      font-weight: 600;
    }

    /* 响应式缩放 - iPhone */
    @media (max-height: 900px) {
      .phone-container:not(.phone-container--ipad) {
        transform: scale(0.85);
      }
    }

    @media (max-height: 750px) {
      .phone-container:not(.phone-container--ipad) {
        transform: scale(0.7);
      }
    }

    @media (max-width: 420px) {
      .phone-container:not(.phone-container--ipad) {
        transform: scale(0.8);
      }
    }

    @media (max-width: 360px) {
      .phone-container:not(.phone-container--ipad) {
        transform: scale(0.65);
      }
    }

    /* 响应式缩放 - iPad */
    @media (max-width: 1100px) {
      .phone-container--ipad {
        transform: scale(0.75);
      }
    }

    @media (max-width: 820px) {
      .phone-container--ipad {
        transform: scale(0.55);
      }
    }

    @media (max-width: 600px) {
      .phone-container--ipad {
        transform: scale(0.4);
      }
    }

    @media (max-height: 860px) {
      .phone-container--ipad {
        transform: scale(0.7);
      }
    }

    @media (max-height: 700px) {
      .phone-container--ipad {
        transform: scale(0.55);
      }
    }
  </style>
</head>
<body>
  <div class="device-tabs">
    <div class="device-tabs-slider"></div>
    <button class="device-tab active" data-device="iphone">iPhone</button>
    <button class="device-tab" data-device="ipad">iPad</button>
  </div>

  <div class="phone-container">
    <!-- 左侧音量键 -->
    <div class="volume-up"></div>
    <div class="volume-down"></div>

    <!-- 手机外框 -->
    <div class="phone-frame">
      <div class="phone-screen">
        <!-- 灵动岛 -->
        <div class="dynamic-island"></div>

        <!-- iPad 前置摄像头 -->
        <div class="ipad-camera"></div>

        <!-- 嵌入内容 -->
        <iframe src="http://localhost:3000/index_babylon.html" allow="accelerometer; gyroscope"></iframe>

        <!-- Home Indicator -->
        <div class="home-indicator"></div>
      </div>
    </div>
  </div>

  <!-- 右下角行中/行前切换 -->
  <div class="mode-tabs">
    <div class="mode-tabs-slider"></div>
    <button class="mode-tab active" data-mode="inpark">行中</button>
    <button class="mode-tab" data-mode="pretrip">行前（2日票）</button>
  </div>

  <p style="position:absolute;bottom:24px;font-size:12px;color:#999;">Fliggy Design</p>

  <script>
    // ===== 访客记录 (localStorage) =====
    (function(){
      var LOG_KEY = 'disney_visitor_log';

      // 收集访问信息
      var record = {
        id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
        visitedAt: new Date().toISOString(),
        page: location.pathname + location.hash,
        device: /Mobile|Android|iPhone/i.test(navigator.userAgent) ? 'mobile' :
                /iPad|Tablet/i.test(navigator.userAgent) ? 'tablet' : 'desktop',
        userAgent: navigator.userAgent,
        screenWidth: screen.width,
        screenHeight: screen.height,
        language: navigator.language,
        referrer: document.referrer || '(direct)'
      };

      // 读取现有记录
      var logs = [];
      try {
        logs = JSON.parse(localStorage.getItem(LOG_KEY) || '[]');
      } catch(e) { logs = []; }

      // 追加新记录（最多保留 500 条，防止 localStorage 溢出）
      logs.unshift(record);
      if (logs.length > 500) logs = logs.slice(0, 500);

      // 存储
      try {
        localStorage.setItem(LOG_KEY, JSON.stringify(logs));
      } catch(e) { console.log('[visitor-log] storage full'); }
    })();

    const tabs = document.querySelectorAll('.device-tab');
    const container = document.querySelector('.phone-container');
    const slider = document.querySelector('.device-tabs-slider');

    function moveSlider(activeTab) {
      slider.style.width = activeTab.offsetWidth + 'px';
      slider.style.transform = 'translateX(' + (activeTab.offsetLeft - 4) + 'px)';
    }

    // 初始化滑块位置
    moveSlider(document.querySelector('.device-tab.active'));

    // 右下角模式切换
    const modeTabs = document.querySelectorAll('.mode-tab');
    const modeSlider = document.querySelector('.mode-tabs-slider');

    function moveModeSlider(activeTab) {
      modeSlider.style.width = activeTab.offsetWidth + 'px';
      modeSlider.style.transform = 'translateX(' + activeTab.offsetLeft + 'px)';
    }

    moveModeSlider(document.querySelector('.mode-tab.active'));

    modeTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        modeTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        moveModeSlider(tab);

        const mode = tab.dataset.mode;
        const iframe = document.querySelector('.phone-screen iframe');
        if (mode === 'pretrip') {
          iframe.src = 'http://localhost:3000/index_pretrip.html';
        } else {
          iframe.src = 'http://localhost:3000/index_babylon.html';
        }
      });
    });

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        moveSlider(tab);

        const device = tab.dataset.device;
        if (device === 'ipad') {
          container.classList.add('phone-container--ipad');
        } else {
          container.classList.remove('phone-container--ipad');
        }
      });
    });
  </script>
</body>
</html>
