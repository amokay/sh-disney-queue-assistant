<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shanghai Disney Twin - Phone Preview</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #EEEEFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Device Tab 切换栏 */
    .device-tabs {
      position: relative;
      display: flex;
      gap: 4px;
      padding: 4px;
      margin-bottom: 40px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 28px;
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .device-tabs.hidden {
      display: none;
    }

    .device-tabs-slider {
      position: absolute;
      top: 4px;
      left: 4px;
      height: calc(100% - 8px);
      border-radius: 16px;
      background: #1c1c1e;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 0;
    }

    .device-tab {
      position: relative;
      z-index: 1;
      padding: 8px 24px;
      border: none;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.25s ease;
      background: transparent;
      color: #333;
      outline: none;
    }

    .device-tab:hover {
      color: #555;
    }

    .device-tab.active {
      color: #fff;
    }

    /* 入口模式 tab 字号缩小，保持与 iPhone/Foldable tab 同高 */
    #entry-tabs .device-tab {
      font-size: 12px;
      padding: 8px 16px;
    }

    .phone-container {
      position: relative;
      width: 375px;
      height: 812px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), border-radius 0.4s ease;
      flex-shrink: 0;
    }

    /* Foldable 模式 - 三星三折叠展开尺寸 (高度不变，只增加宽度) */
    .phone-container--foldable {
      width: 1083px;
      height: 812px;
    }

    .phone-container--foldable .phone-frame {
      border-radius: 30px;
    }

    .phone-container--foldable .phone-screen {
      border-radius: 16px;
    }

    .phone-container--foldable .phone-screen iframe {
      border-radius: 16px;
    }

    .phone-container--foldable .dynamic-island {
      display: none;
    }

    .phone-container--foldable .home-indicator {
      width: 180px;
    }

    /* Foldable 前置摄像头（左侧居中） */
    .foldable-camera {
      display: none;
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2a2a2e;
      z-index: 10;
    }

    .phone-container--foldable .foldable-camera {
      display: block;
    }

    /* Foldable 模式隐藏物理按键 */
    .phone-container--foldable::after,
    .phone-container--foldable::before,
    .phone-container--foldable .volume-up,
    .phone-container--foldable .volume-down {
      display: none;
    }

    /* 手机外框 */
    .phone-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border: 12px solid #1c1c1e;
      border-radius: 50px;
      box-shadow:
        0 30px 60px rgba(0, 0, 0, 0.5),
        0 0 0 2px #333,
        inset 0 0 4px rgba(255, 255, 255, 0.05);
      background: #000;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* 屏幕区域 */
    .phone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 40px;
      overflow: hidden;
      background: #000;
      transition: background-color 0.2s ease;
    }

    /* 入口模式下屏幕底色用浅灰，避免 iframe 切换瞬间露出黑底 */
    .phone-container--entry .phone-screen {
      background: #F2F3F5;
    }

    /* 灵动岛 */
    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 30px;
      border-radius: 20px;
      background: #000;
      z-index: 10;
    }

    /* Home Indicator */
    .home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.3);
      z-index: 10;
    }

    /* iframe 填满屏幕 */
    .phone-screen iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 40px;
      /* iframe 自身保留浅色底，防止跨页加载瞬间出现黑色闪屏 */
      background-color: #F2F3F5;
    }

    /* 右侧电源键 */
    .phone-container::after {
      content: '';
      position: absolute;
      right: -4px;
      top: 180px;
      width: 4px;
      height: 80px;
      background: linear-gradient(to bottom, #2a2a2a, #1c1c1e, #2a2a2a);
      border-radius: 0 3px 3px 0;
    }

    /* 左侧音量键 - 静音开关 */
    .phone-container::before {
      content: '';
      position: absolute;
      left: -4px;
      top: 140px;
      width: 4px;
      height: 30px;
      background: linear-gradient(to bottom, #2a2a2a, #1c1c1e, #2a2a2a);
      border-radius: 3px 0 0 3px;
    }

    /* 左侧音量键 - 音量加 */
    .volume-up {
      position: absolute;
      left: -4px;
      top: 190px;
      width: 4px;
      height: 55px;
      background: linear-gradient(to bottom, #2a2a2a, #1c1c1e, #2a2a2a);
      border-radius: 3px 0 0 3px;
    }

    /* 左侧音量键 - 音量减 */
    .volume-down {
      position: absolute;
      left: -4px;
      top: 255px;
      width: 4px;
      height: 55px;
      background: linear-gradient(to bottom, #2a2a2a, #1c1c1e, #2a2a2a);
      border-radius: 3px 0 0 3px;
    }

    /* 右下角模式切换 Tab（下划线风格） */
    .mode-tabs {
      position: absolute;
      bottom: 60px;
      right: 40px;
      display: flex;
      gap: 0;
    }

    .mode-tabs-slider {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2px;
      border-radius: 1px;
      background: #1c1c1e;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mode-tab {
      position: relative;
      padding: 6px 16px;
      border: none;
      border-radius: 0;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      transition: color 0.25s ease, font-weight 0.25s ease;
      background: transparent;
      color: #999;
      outline: none;
    }

    .mode-tab:hover {
      color: #555;
    }

    .mode-tab.active {
      color: #1c1c1e;
      font-weight: 600;
    }

    /* 响应式缩放 - iPhone */
    @media (max-height: 900px) {
      .phone-container:not(.phone-container--foldable) {
        transform: scale(0.85);
      }
    }

    @media (max-height: 750px) {
      .phone-container:not(.phone-container--foldable) {
        transform: scale(0.7);
      }
    }

    @media (max-width: 420px) {
      .phone-container:not(.phone-container--foldable) {
        transform: scale(0.8);
      }
    }

    @media (max-width: 360px) {
      .phone-container:not(.phone-container--foldable) {
        transform: scale(0.65);
      }
    }

    /* 响应式缩放 - Foldable */
    @media (max-width: 1100px) {
      .phone-container--foldable {
        transform: scale(0.75);
      }
    }

    @media (max-width: 820px) {
      .phone-container--foldable {
        transform: scale(0.55);
      }
    }

    @media (max-width: 600px) {
      .phone-container--foldable {
        transform: scale(0.4);
      }
    }

    @media (max-height: 860px) {
      .phone-container--foldable {
        transform: scale(0.7);
      }
    }

    @media (max-height: 700px) {
      .phone-container--foldable {
        transform: scale(0.55);
      }
    }
  </style>
</head>
<body>
  <!-- 入口模式：页面切换 -->
  <div class="device-tabs hidden" id="entry-tabs">
    <div class="device-tabs-slider"></div>
    <button class="device-tab active" data-page="entry">订详</button>
    <button class="device-tab" data-page="qianwen">千问</button>
  </div>

  <!-- 行中/行前模式：设备尺寸切换 -->
  <div class="device-tabs" id="size-tabs">
    <div class="device-tabs-slider"></div>
    <button class="device-tab active" data-device="iphone">iPhone</button>
    <button class="device-tab" data-device="foldable">Foldable</button>
  </div>

  <div class="phone-container">
    <!-- 左侧音量键 -->
    <div class="volume-up"></div>
    <div class="volume-down"></div>

    <!-- 手机外框 -->
    <div class="phone-frame">
      <div class="phone-screen">
        <!-- 灵动岛 -->
        <div class="dynamic-island"></div>

        <!-- Foldable 前置摄像头 -->
        <div class="foldable-camera"></div>

        <!-- 嵌入内容 -->
        <iframe src="./index_babylon.html" allow="accelerometer; gyroscope"></iframe>

        <!-- Home Indicator -->
        <div class="home-indicator"></div>
      </div>
    </div>
  </div>

  <!-- 右下角入口/行中/行前切换 -->
  <div class="mode-tabs">
    <div class="mode-tabs-slider"></div>
    <button class="mode-tab" data-mode="entry">入口</button>
    <button class="mode-tab active" data-mode="inpark">行中</button>
    <button class="mode-tab" data-mode="pretrip">行前（2日票）</button>
  </div>

  <p style="position:absolute;bottom:24px;font-size:12px;color:#999;">Fliggy Design</p>

  <script>
    const container = document.querySelector('.phone-container');

    // === 入口模式 tabs ===
    const entryTabs = document.querySelector('#entry-tabs');
    const entryButtons = entryTabs.querySelectorAll('.device-tab');
    const entrySlider = entryTabs.querySelector('.device-tabs-slider');

    const pageMap = {
      entry: './index_detail_entry.html',
      qianwen: './index_qianwen.html'
    };

    function moveEntrySlider(activeTab) {
      entrySlider.style.width = activeTab.offsetWidth + 'px';
      entrySlider.style.transform = 'translateX(' + (activeTab.offsetLeft - 4) + 'px)';
    }
    moveEntrySlider(entryTabs.querySelector('.device-tab.active'));

    entryButtons.forEach(tab => {
      tab.addEventListener('click', () => {
        entryButtons.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        moveEntrySlider(tab);
        const iframe = document.querySelector('.phone-screen iframe');
        iframe.src = pageMap[tab.dataset.page] || './index_entry.html';
      });
    });

    // === 行中/行前模式 tabs（设备尺寸） ===
    const sizeTabs = document.querySelector('#size-tabs');
    const sizeButtons = sizeTabs.querySelectorAll('.device-tab');
    const sizeSlider = sizeTabs.querySelector('.device-tabs-slider');

    function moveSizeSlider(activeTab) {
      sizeSlider.style.width = activeTab.offsetWidth + 'px';
      sizeSlider.style.transform = 'translateX(' + (activeTab.offsetLeft - 4) + 'px)';
    }
    moveSizeSlider(sizeTabs.querySelector('.device-tab.active'));

    sizeButtons.forEach(tab => {
      tab.addEventListener('click', () => {
        sizeButtons.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        moveSizeSlider(tab);
        if (tab.dataset.device === 'foldable') {
          container.classList.add('phone-container--foldable');
        } else {
          container.classList.remove('phone-container--foldable');
        }
      });
    });

    // === 右下角模式切换 ===
    const modeTabs = document.querySelectorAll('.mode-tab');
    const modeSlider = document.querySelector('.mode-tabs-slider');

    function moveModeSlider(activeTab) {
      modeSlider.style.width = activeTab.offsetWidth + 'px';
      modeSlider.style.transform = 'translateX(' + activeTab.offsetLeft + 'px)';
    }

    moveModeSlider(document.querySelector('.mode-tab.active'));

    modeTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        modeTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        moveModeSlider(tab);

        const mode = tab.dataset.mode;
        const iframe = document.querySelector('.phone-screen iframe');

        if (mode === 'entry') {
          // 入口模式：显示页面切换 tabs，隐藏设备尺寸 tabs，强制 iPhone 尺寸
          entryTabs.classList.remove('hidden');
          entryTabs.classList.add('visible');
          sizeTabs.classList.remove('visible');
          sizeTabs.classList.add('hidden');
          container.classList.remove('phone-container--foldable');
          // 切到入口模式：让屏幕底色提前变浅，避免 iframe 加载瞬间露黑
          container.classList.add('phone-container--entry');
          // entry-tabs 之前是 hidden（display:none），slider 宽度为 0，需在显示后重算
          requestAnimationFrame(() => {
            moveEntrySlider(entryTabs.querySelector('.device-tab.active'));
          });
          const activePage = entryTabs.querySelector('.device-tab.active').dataset.page;
          iframe.src = pageMap[activePage] || './index_detail_entry.html';
        } else {
          // 行中/行前：显示设备尺寸 tabs，隐藏页面切换 tabs，强制重置为 iPhone
          entryTabs.classList.remove('visible');
          entryTabs.classList.add('hidden');
          sizeTabs.classList.remove('hidden');
          sizeTabs.classList.add('visible');
          // 重置 size-tabs 选中状态为 iPhone
          sizeButtons.forEach(t => t.classList.remove('active'));
          sizeTabs.querySelector('[data-device="iphone"]').classList.add('active');
          container.classList.remove('phone-container--foldable');
          container.classList.remove('phone-container--entry');
          moveSizeSlider(sizeTabs.querySelector('.device-tab.active'));
          if (mode === 'pretrip') {
            iframe.src = './index_pretrip.html';
          } else {
            iframe.src = './index_babylon.html';
          }
        }
      });
    });
  </script>
</body>
</html>
