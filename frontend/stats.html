<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>访客统计 - 私密</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .stats-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 900px;
      width: 100%;
      overflow: hidden;
    }

    .stats-header {
      background: linear-gradient(135deg, #1E40AF 0%, #3B82F6 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .stats-header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .stats-header p {
      opacity: 0.9;
      font-size: 14px;
    }

    .stats-content {
      padding: 30px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .stat-number {
      font-size: 48px;
      font-weight: bold;
      color: #1E40AF;
      margin-bottom: 8px;
    }

    .stat-label {
      font-size: 14px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .flag-counter-section {
      text-align: center;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 12px;
    }

    .flag-counter-section h2 {
      margin-bottom: 20px;
      color: #333;
      font-size: 20px;
    }

    .refresh-btn {
      background: #1E40AF;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
      transition: background 0.3s ease;
    }

    .refresh-btn:hover {
      background: #1e3a8a;
    }

    .auto-refresh {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: 0.4s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #1E40AF;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }

    .last-update {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #999;
    }

    @media (max-width: 600px) {
      .stats-header h1 {
        font-size: 24px;
      }
      
      .stat-number {
        font-size: 36px;
      }
    }
  </style>
</head>
<body>
  <div class="stats-container">
    <div class="stats-header">
      <h1>📊 迪士尼助手访客统计</h1>
      <p>实时访问数据监控面板</p>
    </div>

    <div class="stats-content">
      <!-- Flag Counter 统计 -->
      <div class="flag-counter-section">
        <h2>🌍 全球访客分布</h2>
        <img src="https://s01.flagcounter.com/count/nX5/bg_FFFFFF/txt_000000/border_CCCCCC/columns_4/maxflags_20/viewers_0/labels_1/pageviews_1/flags_1/percent_1/" alt="Visitor Counter" style="border: 0;">
      </div>

      <!-- 详细访客信息 -->
      <div class="visitor-details" style="margin-top: 30px; background: #f8f9fa; border-radius: 12px; padding: 20px;">
        <h2 style="margin-bottom: 20px; color: #333; font-size: 20px;">📱 当前访问者详细信息</h2>
        
        <div class="info-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px;">
          <div class="info-item" style="background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
            <div style="font-size: 12px; color: #999; margin-bottom: 5px;">IP 地址</div>
            <div id="ipAddress" style="font-size: 16px; font-weight: bold; color: #1E40AF;">加载中...</div>
          </div>
          
          <div class="info-item" style="background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
            <div style="font-size: 12px; color: #999; margin-bottom: 5px;">国家/地区</div>
            <div id="country" style="font-size: 16px; font-weight: bold; color: #1E40AF;">加载中...</div>
          </div>
          
          <div class="info-item" style="background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
            <div style="font-size: 12px; color: #999; margin-bottom: 5px;">操作系统</div>
            <div id="osInfo" style="font-size: 16px; font-weight: bold; color: #1E40AF;">检测中...</div>
          </div>
          
          <div class="info-item" style="background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
            <div style="font-size: 12px; color: #999; margin-bottom: 5px;">浏览器</div>
            <div id="browserInfo" style="font-size: 16px; font-weight: bold; color: #1E40AF;">检测中...</div>
          </div>
          
          <div class="info-item" style="background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
            <div style="font-size: 12px; color: #999; margin-bottom: 5px;">屏幕分辨率</div>
            <div id="screenResolution" style="font-size: 16px; font-weight: bold; color: #1E40AF;">检测中...</div>
          </div>
          
          <div class="info-item" style="background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
            <div style="font-size: 12px; color: #999; margin-bottom: 5px;">视口大小</div>
            <div id="viewportSize" style="font-size: 16px; font-weight: bold; color: #1E40AF;">检测中...</div>
          </div>
          
          <div class="info-item" style="background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
            <div style="font-size: 12px; color: #999; margin-bottom: 5px;">设备类型</div>
            <div id="deviceType" style="font-size: 16px; font-weight: bold; color: #1E40AF;">检测中...</div>
          </div>
          
          <div class="info-item" style="background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
            <div style="font-size: 12px; color: #999; margin-bottom: 5px;">语言设置</div>
            <div id="language" style="font-size: 16px; font-weight: bold; color: #1E40AF;">检测中...</div>
          </div>
        </div>
      </div>

      <!-- 快速刷新按钮 -->
      <div style="text-align: center;">
        <button class="refresh-btn" onclick="location.reload()">🔄 刷新统计数据</button>
        
        <div class="auto-refresh">
          <span>自动刷新 (每30秒):</span>
          <label class="toggle-switch">
            <input type="checkbox" id="autoRefresh" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="last-update" id="lastUpdate">
        最后更新: <span id="updateTime">--</span>
      </div>
    </div>
  </div>

  <script>
    // 获取访客详细信息
    async function fetchVisitorInfo() {
      try {
        // 使用 ipapi.co 免费 API 获取 IP、国家等信息
        const response = await fetch('https://ipapi.co/json/');
        if (response.ok) {
          const data = await response.json();
          
          document.getElementById('ipAddress').textContent = data.ip || '未知';
          document.getElementById('country').textContent = `${data.country_name || '未知'} (${data.country_code || '-'})`;
        } else {
          document.getElementById('ipAddress').textContent = '无法获取';
          document.getElementById('country').textContent = '无法获取';
        }
      } catch (error) {
        console.error('获取IP信息失败:', error);
        document.getElementById('ipAddress').textContent = '加载失败';
        document.getElementById('country').textContent = '加载失败';
      }
    }

    // 检测操作系统
    function detectOS() {
      const userAgent = navigator.userAgent;
      let os = '未知';
      
      if (userAgent.indexOf('Win') !== -1) os = 'Windows';
      else if (userAgent.indexOf('Mac') !== -1) os = 'macOS';
      else if (userAgent.indexOf('Linux') !== -1) os = 'Linux';
      else if (userAgent.indexOf('Android') !== -1) os = 'Android';
      else if (userAgent.indexOf('like Mac') !== -1) os = 'iOS';
      
      return os;
    }

    // 检测浏览器
    function detectBrowser() {
      const userAgent = navigator.userAgent;
      let browser = '未知';
      
      if (userAgent.indexOf('Firefox') !== -1) browser = 'Firefox';
      else if (userAgent.indexOf('SamsungBrowser') !== -1) browser = 'Samsung Internet';
      else if (userAgent.indexOf('Opera') !== -1 || userAgent.indexOf('OPR') !== -1) browser = 'Opera';
      else if (userAgent.indexOf('Trident') !== -1) browser = 'Internet Explorer';
      else if (userAgent.indexOf('Edge') !== -1) browser = 'Edge';
      else if (userAgent.indexOf('Chrome') !== -1) browser = 'Chrome';
      else if (userAgent.indexOf('Safari') !== -1) browser = 'Safari';
      
      return browser;
    }

    // 检测设备类型
    function detectDeviceType() {
      const userAgent = navigator.userAgent.toLowerCase();
      const width = window.innerWidth;
      
      if (/tablet|ipad|playbook|silk/i.test(userAgent)) return '平板';
      if (/mobile|iphone|ipod|android.*mobile|windows.*phone|blackberry.*mobile/i.test(userAgent)) return '手机';
      if (width < 768) return '手机';
      if (width < 1024) return '平板';
      return '桌面电脑';
    }

    // 显示所有设备信息
    function displayDeviceInfo() {
      // IP和国家
      fetchVisitorInfo();
      
      // 操作系统
      document.getElementById('osInfo').textContent = detectOS();
      
      // 浏览器
      document.getElementById('browserInfo').textContent = detectBrowser();
      
      // 屏幕分辨率
      document.getElementById('screenResolution').textContent = `${window.screen.width} x ${window.screen.height}`;
      
      // 视口大小
      document.getElementById('viewportSize').textContent = `${window.innerWidth} x ${window.innerHeight}`;
      
      // 设备类型
      document.getElementById('deviceType').textContent = detectDeviceType();
      
      // 语言
      document.getElementById('language').textContent = navigator.language || navigator.userLanguage || '未知';
    }

    // 显示最后更新时间
    function updateTimestamp() {
      const now = new Date();
      const timeString = now.toLocaleString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      document.getElementById('updateTime').textContent = timeString;
    }

    // 初始化
    displayDeviceInfo();
    updateTimestamp();

    // 自动刷新功能
    let autoRefreshInterval;
    const autoRefreshCheckbox = document.getElementById('autoRefresh');

    function startAutoRefresh() {
      if (autoRefreshInterval) clearInterval(autoRefreshInterval);
      autoRefreshInterval = setInterval(() => {
        location.reload();
      }, 30000); // 30秒刷新一次
    }

    function stopAutoRefresh() {
      if (autoRefreshInterval) {
        clearInterval(autoRefreshInterval);
        autoRefreshInterval = null;
      }
    }

    autoRefreshCheckbox.addEventListener('change', () => {
      if (autoRefreshCheckbox.checked) {
        startAutoRefresh();
      } else {
        stopAutoRefresh();
      }
    });

    // 默认启动自动刷新
    startAutoRefresh();

    // 页面可见性变化时处理自动刷新
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopAutoRefresh();
      } else if (autoRefreshCheckbox.checked) {
        startAutoRefresh();
      }
    });

    console.log('📊 访客统计页面已加载');
    console.log('💡 提示: 这是一个私密页面，请勿分享URL给他人');
  </script>
</body>
</html>
