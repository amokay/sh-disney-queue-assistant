<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>访客记录（本地）</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #fafafa;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 64px;
    }

    .header {
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e0e0e0;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 600;
      color: #111;
      margin-bottom: 4px;
    }
    .header .subtitle {
      font-size: 13px;
      color: #888;
    }

    /* 统计卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 18px 20px;
    }
    .stat-card .label {
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 6px;
    }
    .stat-card .value {
      font-size: 26px;
      font-weight: 700;
      color: #111;
    }

    /* 工具栏 */
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .toolbar input[type="text"] {
      padding: 8px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      width: 220px;
      transition: border-color 0.2s;
    }
    .toolbar input[type="text"]:focus {
      border-color: #999;
    }
    .toolbar .btn {
      padding: 8px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      color: #333;
      transition: background 0.2s;
    }
    .toolbar .btn:hover {
      background: #f0f0f0;
    }
    .toolbar .btn-danger {
      color: #c00;
      border-color: #e0c0c0;
    }
    .toolbar .btn-danger:hover {
      background: #fff0f0;
    }
    .toolbar .result-count {
      font-size: 12px;
      color: #888;
      margin-left: auto;
    }

    /* 表格 */
    .table-wrap {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }
    thead th {
      text-align: left;
      padding: 12px 14px;
      font-size: 12px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      border-bottom: 1px solid #e0e0e0;
      background: #fafafa;
      white-space: nowrap;
    }
    tbody td {
      padding: 10px 14px;
      font-size: 13px;
      color: #333;
      border-bottom: 1px solid #f0f0f0;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    tbody tr:last-child td {
      border-bottom: none;
    }
    tbody tr:hover {
      background: #f8f8f8;
    }
    .device-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      background: #f0f0f0;
      color: #333;
    }

    /* 分页 */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }
    .pagination button {
      padding: 6px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      color: #333;
      transition: background 0.2s;
    }
    .pagination button:hover:not(:disabled) {
      background: #f0f0f0;
    }
    .pagination button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .pagination .page-info {
      font-size: 12px;
      color: #888;
    }

    .empty-msg {
      text-align: center;
      padding: 60px 20px;
      color: #888;
      font-size: 14px;
    }

    /* 数据来源指示 */
    .source-indicator {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 16px;
      border: 1px solid transparent;
    }
    .source-indicator.merged {
      background: #f0f8f0;
      border-color: #cfe5cf;
      color: #2a6a2a;
    }
    .source-indicator.local-only {
      background: #f5f5f5;
      border-color: #e0e0e0;
      color: #666;
    }
    .export-hint {
      font-size: 12px;
      color: #888;
      margin-top: 8px;
      line-height: 1.6;
    }
    .export-hint code {
      background: #f0f0f0;
      padding: 1px 6px;
      border-radius: 3px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px;
      color: #333;
    }

    /* 响应式 */
    @media (max-width: 600px) {
      .page { padding: 20px 12px 40px; }
      .toolbar input[type="text"] { width: 100%; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>访客记录</h1>
    <div class="subtitle">部署静态数据 + 浏览器本地数据 合并展示</div>
  </div>

  <div id="sourceIndicator" class="source-indicator local-only">数据加载中…</div>

  <!-- 统计卡片 -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="label">总访问次数</div>
      <div class="value" id="statTotal">--</div>
    </div>
    <div class="stat-card">
      <div class="label">今日访问</div>
      <div class="value" id="statToday">--</div>
    </div>
    <div class="stat-card">
      <div class="label">主要设备</div>
      <div class="value" id="statDevice">--</div>
    </div>
    <div class="stat-card">
      <div class="label">最近访问</div>
      <div class="value" id="statLatest" style="font-size:15px;">--</div>
    </div>
  </div>

  <!-- 工具栏 -->
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="搜索设备类型或页面路径...">
    <button class="btn" id="btnExport">导出 JSON</button>
    <button class="btn btn-danger" id="btnClear">清除记录</button>
    <span class="result-count" id="resultCount"></span>
  </div>
  <div class="export-hint">
    工作流：点击「导出 JSON」下载文件，将其重命名为 <code>visitors-data.json</code> 放入 <code>frontend/</code> 目录，下次部署即可在线上查看汇总数据。
  </div>

  <!-- 表格 -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>设备类型</th>
          <th>页面路径</th>
          <th>访问时间</th>
          <th>屏幕分辨率</th>
          <th>语言</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="6" class="empty-msg">加载中...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- 分页 -->
  <div class="pagination">
    <button id="btnPrev" disabled>上一页</button>
    <span class="page-info" id="pageInfo">第 1 页</span>
    <button id="btnNext" disabled>下一页</button>
  </div>
</div>

<script>
// ============================================================
// localStorage 访客记录查看器
// key: disney_visitor_log
// ============================================================
var LOG_KEY = 'disney_visitor_log';
var STATIC_DATA_URL = 'visitors-data.json';
var PAGE_SIZE = 50;
var allRecords = [];
var localRecords = [];
var staticRecords = [];
var filteredRecords = [];
var currentPage = 1;

// ============================================================
// 初始化
// ============================================================
(function init() {
  document.getElementById('searchInput').addEventListener('input', applyFilters);
  document.getElementById('btnPrev').addEventListener('click', function(){ changePage(-1); });
  document.getElementById('btnNext').addEventListener('click', function(){ changePage(1); });
  document.getElementById('btnClear').addEventListener('click', clearRecords);
  document.getElementById('btnExport').addEventListener('click', exportJSON);

  loadAllData(function(merged, hasStatic) {
    allRecords = merged;
    updateSourceIndicator(hasStatic);
    computeStats();
    applyFilters();
  });
})();

// ============================================================
// 数据加载（合并静态 JSON + localStorage）
// ============================================================
function loadAllData(callback) {
  localRecords = [];
  try {
    localRecords = JSON.parse(localStorage.getItem(LOG_KEY) || '[]');
  } catch(e) { localRecords = []; }

  // 加 cache-busting 参数避免 CDN 缓存旧数据
  var url = STATIC_DATA_URL + '?t=' + Date.now();
  fetch(url)
    .then(function(r) {
      if (!r.ok) throw new Error('no file');
      return r.json();
    })
    .then(function(data) {
      staticRecords = (data && data.length) ? data : [];
      var merged = mergeAndDedupe(staticRecords, localRecords);
      callback(merged, true);
    })
    .catch(function() {
      staticRecords = [];
      var merged = mergeAndDedupe([], localRecords);
      callback(merged, false);
    });
}

function mergeAndDedupe(arr1, arr2) {
  var map = {};
  var all = (arr1 || []).concat(arr2 || []);
  var result = [];
  for (var i = 0; i < all.length; i++) {
    var item = all[i];
    if (!item) continue;
    var id = item.id;
    // 无 id 的记录用「时间+UA」作降级 key 去重
    if (!id) {
      id = (item.visitedAt || '') + '|' + (item.userAgent || '');
    }
    if (!map[id]) {
      map[id] = true;
      result.push(item);
    }
  }
  result.sort(function(a, b) {
    return new Date(b.visitedAt || 0) - new Date(a.visitedAt || 0);
  });
  return result;
}

function updateSourceIndicator(hasStatic) {
  var el = document.getElementById('sourceIndicator');
  if (hasStatic) {
    el.className = 'source-indicator merged';
    el.textContent = '已加载部署数据（' + staticRecords.length + ' 条） + 本地数据（' + localRecords.length + ' 条），合并去重后 ' + allRecords.length + ' 条';
  } else {
    el.className = 'source-indicator local-only';
    el.textContent = '仅显示本机浏览器记录（共 ' + localRecords.length + ' 条）';
  }
}

// ============================================================
// 统计计算
// ============================================================
function computeStats() {
  document.getElementById('statTotal').textContent = allRecords.length;

  // 今日访问
  var today = new Date().toISOString().slice(0, 10);
  var todayCount = 0;
  for (var i = 0; i < allRecords.length; i++) {
    var t = allRecords[i].visitedAt || '';
    if (t.slice(0, 10) === today) todayCount++;
  }
  document.getElementById('statToday').textContent = todayCount;

  // 主要设备类型
  var deviceCount = {};
  for (var j = 0; j < allRecords.length; j++) {
    var d = allRecords[j].device || 'unknown';
    deviceCount[d] = (deviceCount[d] || 0) + 1;
  }
  var topDevice = '--';
  var topCount = 0;
  for (var key in deviceCount) {
    if (deviceCount[key] > topCount) {
      topCount = deviceCount[key];
      topDevice = key;
    }
  }
  document.getElementById('statDevice').textContent = topDevice;

  // 最近访问时间
  if (allRecords.length > 0) {
    var latest = allRecords[0].visitedAt || '';
    document.getElementById('statLatest').textContent = formatTime(latest);
  }
}

// ============================================================
// 筛选与搜索
// ============================================================
function applyFilters() {
  var keyword = (document.getElementById('searchInput').value || '').toLowerCase();

  filteredRecords = [];
  for (var i = 0; i < allRecords.length; i++) {
    var r = allRecords[i];
    if (keyword) {
      var haystack = ((r.device || '') + ' ' + (r.page || '')).toLowerCase();
      if (haystack.indexOf(keyword) === -1) continue;
    }
    filteredRecords.push(r);
  }

  document.getElementById('resultCount').textContent = '共 ' + filteredRecords.length + ' 条';
  currentPage = 1;
  renderTable();
}

// ============================================================
// 表格渲染
// ============================================================
function renderTable() {
  var start = (currentPage - 1) * PAGE_SIZE;
  var end = start + PAGE_SIZE;
  var pageData = filteredRecords.slice(start, end);

  var tbody = document.getElementById('tableBody');

  if (pageData.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-msg">暂无数据</td></tr>';
    updatePagination();
    return;
  }

  var html = '';
  for (var i = 0; i < pageData.length; i++) {
    var r = pageData[i];
    var idx = start + i + 1;
    var time = formatTime(r.visitedAt || '');
    var resolution = (r.screenWidth || '-') + ' x ' + (r.screenHeight || '-');
    html += '<tr>'
      + '<td>' + idx + '</td>'
      + '<td><span class="device-badge">' + escapeHtml(r.device || '-') + '</span></td>'
      + '<td>' + escapeHtml(r.page || '-') + '</td>'
      + '<td>' + time + '</td>'
      + '<td>' + escapeHtml(resolution) + '</td>'
      + '<td>' + escapeHtml(r.language || '-') + '</td>'
      + '</tr>';
  }
  tbody.innerHTML = html;
  updatePagination();
}

function updatePagination() {
  var totalPages = Math.max(1, Math.ceil(filteredRecords.length / PAGE_SIZE));
  document.getElementById('pageInfo').textContent = '第 ' + currentPage + ' / ' + totalPages + ' 页';
  document.getElementById('btnPrev').disabled = (currentPage <= 1);
  document.getElementById('btnNext').disabled = (currentPage >= totalPages);
}

function changePage(delta) {
  var totalPages = Math.max(1, Math.ceil(filteredRecords.length / PAGE_SIZE));
  var newPage = currentPage + delta;
  if (newPage < 1 || newPage > totalPages) return;
  currentPage = newPage;
  renderTable();
}

// ============================================================
// 清除记录
// ============================================================
function clearRecords() {
  if (!confirm('确定要清除本机浏览器的访客记录吗？（不会影响已部署的 visitors-data.json）')) return;
  localStorage.removeItem(LOG_KEY);
  localRecords = [];
  // 重新合并：保留静态数据，仅清掉本地数据
  allRecords = mergeAndDedupe(staticRecords, []);
  filteredRecords = [];
  updateSourceIndicator(staticRecords.length > 0);
  computeStats();
  applyFilters();
}

// ============================================================
// 导出 JSON
// ============================================================
function exportJSON() {
  // 导出当前合并后的全量数据（静态 + 本地，已去重），用于下次部署
  var data = JSON.stringify(allRecords, null, 2);
  var blob = new Blob([data], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'visitors-data.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ============================================================
// 工具函数
// ============================================================
function formatTime(isoStr) {
  if (!isoStr) return '-';
  try {
    var d = new Date(isoStr);
    var pad = function(n){ return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate())
      + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  } catch(e) { return isoStr; }
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}
</script>
</body>
</html>
